map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}
map $http_x_forwarded_proto $fastcgi_port {
    default 80;
    https 443;
}
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    '' $remote_addr;
}
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php-fpm:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param SERVER_PORT $fastcgi_port;
        fastcgi_param REMOTE_ADDR $client_ip;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 130s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location /storage/ { try_files $uri =404; }
}

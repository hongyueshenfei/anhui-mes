<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工人报工 · 手机原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:#dbe3ef;display:flex;justify-content:center;padding:20px 10px;font-size:14px}
  .phone{width:390px;background:#f4f6fb;border-radius:32px;box-shadow:0 18px 50px rgba(15,30,61,.35);overflow:hidden;border:8px solid #0f1e3d}
  .statusbar{background:#0f1e3d;color:#fff;padding:8px 16px 6px;font-size:11px;display:flex;justify-content:space-between}
  /* 头部 */
  .head{background:linear-gradient(135deg,#1a56db,#1e429f);color:#fff;padding:14px 16px 12px}
  .head .top{display:flex;align-items:center;gap:10px}
  .head .avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
  .head .nm{font-weight:800;font-size:16px}
  .head .meta{font-size:11.5px;opacity:.85;margin-top:2px}
  .head .wx{background:#fff;color:#1e429f;font-size:10.5px;border-radius:8px;padding:2px 7px;margin-left:auto;font-weight:700;white-space:nowrap}
  /* 内容 */
  .body{padding:12px 14px 100px}
  .sec{font-size:12.5px;color:#334155;font-weight:700;margin:12px 4px 7px}
  .task{background:#fff;border:1.5px solid #d7deeb;border-radius:12px;padding:12px;margin-bottom:9px}
  .task.hot{border-color:#fca5a5;background:#fff7f7}
  .task .row1{display:flex;justify-content:space-between;align-items:center}
  .task .prod{font-weight:800;font-size:15px}
  .task .mach{font-size:12px;color:#64748b;margin-top:2px}
  .task .prog{margin-top:8px}
  .task .prog .bar{height:9px;background:#e5eaf3;border-radius:6px;overflow:hidden}
  .task .prog .bar i{display:block;height:100%;background:#1a56db;border-radius:6px}
  .task .prog .bar i.grn{background:#0aa06e}
  .task .prog .nums{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-top:3px}
  .btn-rep{width:100%;background:#1a56db;color:#fff;border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:800;margin-top:8px}
  .btn-rep.grn{background:#0aa06e}
  /* 扫码按钮 */
  .scan{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:360px;background:#fff;border:1px solid #d7deeb;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px}
  .scan .big{background:#1a56db;color:#fff;border:none;width:100%;border-radius:10px;padding:13px;font-size:16px;font-weight:800}
  .scan .qk{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
  .scan .qk button{border:1px solid #d7deeb;background:#fff;border-radius:9px;padding:8px 0;font-size:13px;font-weight:700;color:#1e429f}
  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
  .sheet{background:#fff;width:390px;border-radius:18px 18px 0 0;padding:18px 18px 24px;animation:up .2s}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet h3{font-size:16px;margin-bottom:6px}
  .sheet .info{font-size:12.5px;color:#64748b;line-height:1.7;margin-bottom:10px}
  .qty{display:flex;align-items:center;gap:12px;margin:12px 0}
  .qty button{width:54px;height:48px;border:none;border-radius:12px;background:#eef1f7;font-size:24px;font-weight:800;color:#1e429f}
  .qty input{flex:1;text-align:center;font-size:20px;font-weight:800;border:1.5px solid #c9d3e4;border-radius:12px;height:48px}
  .submit{width:100%;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:800;color:#fff;background:#0aa06e}
  .toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#0f1e3d;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;z-index:40;opacity:0;transition:.25s}
  .foot-nav{display:flex;border-top:1px solid #e2e8f0;background:#fff}
  .foot-nav div{flex:1;text-align:center;padding:9px 0;font-size:12px;color:#64748b}
  .foot-nav div.on{color:#1a56db;font-weight:800}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>09:24</span><span>📶 🔋</span></div>
  <div class="head">
    <div class="top">
      <div class="avatar">张</div>
      <div><div class="nm">张建国</div><div class="meta">注塑一班 · 班组：注塑车间 · 今日白班 08:00-20:00</div></div>
      <div class="wx">✓ 微信免密登录</div>
    </div>
  </div>
  <div class="body">
    <div class="sec">📋 今日任务（2 个）</div>
    <div class="task hot">
      <div class="row1"><span class="prod">花盆 A-300</span><span style="font-size:11px;background:#fef2f2;color:#b91c1c;border-radius:8px;padding:2px 8px;font-weight:700">紧急 · 插单</span></div>
      <div class="mach">I-02 注塑机2号 · TS-826-011 · 交期 8/29</div>
      <div class="prog"><div class="bar"><i style="width:38%"></i></div>
        <div class="nums"><span>已完成 2,280 / 6,000 件</span><span>剩余约 12.4h</span></div>
      </div>
      <button class="btn-rep" onclick="openSheet('花盆 A-300','I-02 注塑机2号','6000','2280')">✅ 报工</button>
    </div>
    <div class="task">
      <div class="row1"><span class="prod">托盘 C-60</span><span style="font-size:11px;background:#fef2f2;color:#b91c1c;border-radius:8px;padding:2px 8px;font-weight:700">紧急</span></div>
      <div class="mach">I-01 注塑机1号 · TS-826-013 · 交期 8/28</div>
      <div class="prog"><div class="bar"><i style="width:0%"></i></div>
        <div class="nums"><span>已完成 0 / 12,000 件</span><span>8/27 16:00 开工</span></div>
      </div>
      <button class="btn-rep" onclick="openSheet('托盘 C-60','I-01 注塑机1号','12000','0')">✅ 报工</button>
    </div>
    <div class="sec">🔎 扫码报工（替代扫码，模拟任务码）</div>
  </div>
  <div class="scan">
    <button class="big" onclick="openScan()">📷 扫码报工 / 直接点选</button>
    <div class="qk">
      <button onclick="openSheet('花盆 A-300','I-02 注塑机2号','6000','2280')">花盆A-300</button>
      <button onclick="openSheet('托盘 C-60','I-01 注塑机1号','12000','0')">托盘C-60</button>
      <button onclick="openSheet('营养钵 D-12','B-01 吹塑机1号','15000','4500')">营养钵D-12</button>
    </div>
  </div>
</div>
<div class="foot-nav">
  <div class="on">📋 今日任务</div><div>⏱ 我的历史</div><div>🛠 交接班</div><div>👤 我的</div>
</div>

<!-- 报工弹层 -->
<div class="mask" id="mask">
  <div class="sheet">
    <h3>报工</h3>
    <div class="info" id="sinfo"></div>
    <div style="display:flex;gap:8px;align-items:center;margin:6px 0 2px">
      <label style="font-size:12px;color:#64748b;white-space:nowrap">报工归属：</label>
      <select id="owner" style="flex:1;height:38px;border:1.5px solid #c9d3e4;border-radius:9px;padding:0 8px;font-size:13px;background:#fff">
        <option>张建国（本人）</option>
        <option>赵六</option>
        <option>孙强</option>
      </select>
    </div>
    <div style="font-size:11px;color:var(--mut);color:#94a3b8;margin-bottom:4px">代报时请选择实际作业人 → 计件工资按实际作业人核算</div>
    <div class="qty">
      <button onclick="adj(-100)">−</button>
      <input id="qty" value="100">
      <button onclick="adj(100)">＋</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button style="flex:1;border:1px solid #c9d3e4;border-radius:8px;padding:7px;background:#fff;font-size:12px;font-weight:700" onclick="qsel(200)">+200</button>
      <button style="flex:1;border:1px solid #c9d3e4;border-radius:8px;padding:7px;background:#fff;font-size:12px;font-weight:700" onclick="qsel(500)">+500</button>
      <button style="flex:1;border:1px solid #c9d3e4;border-radius:8px;padding:7px;background:#fff;font-size:12px;font-weight:700" onclick="qsel(1000)">+1000</button>
      <button style="flex:1;border:1px solid #c9d3e4;border-radius:8px;padding:7px;background:#fff;font-size:12px;font-weight:700" onclick="fin()">🎯 全部完成</button>
    </div>
    <button class="submit" onclick="submit()">✓ 确认报工（累计不超任务量·自动校验）</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function openSheet(prod,mach,total,done){
  document.getElementById("sinfo").innerHTML=`<b>${prod}</b> · ${mach}<br>已完成 ${Number(done).toLocaleString()} / ${Number(total).toLocaleString()} 件 · 本次报工数将自动校验不超剩余量`;
  document.getElementById("qty").value="100";
  document.getElementById("mask").style.display="flex";
}
function openScan(){ toast("已模拟扫码：识别任务 TS-826-011（花盆 A-300）"); openSheet("花盆 A-300","I-02 注塑机2号","6000","2280"); }
function adj(d){ let v=+document.getElementById("qty").value+d; if(v<0)v=0; document.getElementById("qty").value=v; }
function qsel(v){ document.getElementById("qty").value=v; }
function fin(){ document.getElementById("qty").value="完成全部剩余"; }
function submit(){
  document.getElementById("mask").style.display="none";
  toast("✅ 报工成功 · 已实时入系统（任务完工后进入生产入库，推金蝶生产入库单）");
}
let tt; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}
</script>
</body>
</html>
